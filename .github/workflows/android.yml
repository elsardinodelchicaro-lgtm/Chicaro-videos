
name: CHICARO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extraer proyecto
        run: |
          unzip -q source.zip -d app-source

            - name: Compilar APK
        run: |
          GRADLEW=$(find app-source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew"
            find app-source -maxdepth 4 -type f | head -n 50
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        uses: actions/upload-artifact@v4
        with:
          name: CHICARO-APK
          path: app-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
