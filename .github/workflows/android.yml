name: Compilar CHICARO VIDEO APK

on:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
  uses: android-actions/setup-android@v3
  with:
    packages: |
      platform-tools
      platforms;android-35
      build-tools;35.0.0

      - name: Extraer proyecto
        run: unzip -q source.zip -d .

      - name: Compilar APK
        run: gradle -p CHICARO_VIDEO_Android assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CHICARO-VIDEO-APK
          path: CHICARO_VIDEO_Android/app/build/outputs/apk/debug/app-debug.apk
