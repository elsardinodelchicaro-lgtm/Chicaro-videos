
name: CHICARO VIDEO - APK para Android

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraer proyecto
        run: unzip -q source.zip -d app-source

      - name: Compilar APK
        run: |
          GRADLEW=$(find app-source -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew"
            exit 1
          fi

          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CHICARO-VIDEO-APK
          path: app-source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

