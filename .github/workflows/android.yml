
name: CHICARO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extraer proyecto
        run: |
          unzip -q source.zip -d app-source
- name: Ver contenido
  run: |
    ls -la
    find app-source -maxdepth 3 | head -50
      - name: Compilar APK
        run: |
          GRADLEW=$(find app-source -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CHICARO-APK
          path: app-source/**/build/outputs/apk/debug/*.apk
        ./gradlew assembleDebug --stacktrace  
