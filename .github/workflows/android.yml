

name: CHICARO VIDEO - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraer proyecto
        run: unzip -q source.zip -d app-source

      - name: Compilar APK
        run: |
          GRADLEW=$(find app-source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CHICARO-VIDEO-APK
          path: app-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
